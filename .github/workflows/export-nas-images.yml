name: Export official NAS images (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-nas-images.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official ARM64 images
        run: |
          set -euo pipefail
          mkdir -p artifacts
          images=(ghcr.io/moontechlab/lunatv:latest apache/kvrocks:latest bitxeno/atvloadly:latest)
          for image in "${images[@]}"; do
            docker pull --platform linux/arm64 "$image"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = arm64
            docker image inspect --format '{{json .RepoTags}} {{json .RepoDigests}} {{.Architecture}}' "$image" >> artifacts/IMAGE-SOURCES.txt
          done
          docker image save -o artifacts/apple-tv-nas-arm64.tar "${images[@]}"
          (cd artifacts && sha256sum apple-tv-nas-arm64.tar > SHA256SUMS.txt)
      - name: Upload Docker image archive
        uses: actions/upload-artifact@v4
        with:
          name: apple-tv-nas-arm64
          path: artifacts/
          compression-level: 3
          retention-days: 7
          if-no-files-found: error
