name: Build OrionTV for Apple TV (experimental)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-orion-tvos.yml

permissions:
  contents: read

jobs:
  tvos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      EXPO_TV: "1"
      EXPO_USE_METRO_WORKSPACE_ROOT: "1"
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: orion-lib/OrionTV
          ref: 41c7a6005985e5543b9bf302cdd4233d82f1ead5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
      - name: Select Xcode 15.4
        run: sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
      - name: Configure local network access
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.ios.infoPlist = {
            ...config.expo.ios.infoPlist,
            NSLocalNetworkUsageDescription: 'Connect to your media server on your home network.',
            NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
          };
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
          NODE
      - name: Generate tvOS project
        run: |
          # Use only the iOS/tvOS prebuild. The upstream yarn prebuild also copies Android files.
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Build for a real Apple TV
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/OrionTV.xcworkspace \
            -scheme OrionTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/orion-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/orion-tvos.log"
      - name: Package unsigned IPA for NAS signing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/orion-build/Build/Products/Release-appletvos/OrionTV.app"
          test -d "$APP"
          PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")
          test "$PLATFORM" = AppleTVOS
          mkdir -p "$RUNNER_TEMP/orion-ipa/Payload" artifacts
          cp -R "$APP" "$RUNNER_TEMP/orion-ipa/Payload/"
          (cd "$RUNNER_TEMP/orion-ipa" && zip -qry "$GITHUB_WORKSPACE/artifacts/OrionTV-1.3.14-tvos-unsigned.ipa" Payload)
          shasum -a 256 artifacts/*.ipa > artifacts/SHA256SUMS.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-tvos-unsigned
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-build-log
          path: ${{ runner.temp }}/orion-tvos.log
          if-no-files-found: ignore
          retention-days: 7
